            },
            "autoload-dev": {
                "psr-4": {
                    "ApacheSolrForTypo3\\Solr\\Tests\\": "Tests/",
                    "TYPO3\\CMS\\Core\\Tests\\": ".Build/Web/typo3/sysext/core/Tests/"
                }
            },
            "scripts": {
                "info:solr-versions": [
                    "@composer config extra.TYPO3-Solr.version-matrix.Apache-Solr"
                ],
                "info:recommended-solr-version": [
                    "@composer config extra.TYPO3-Solr.version-matrix.Apache-Solr.0"
                ],
                "post-autoload-dump": [
                    "mkdir -p .Build/Web/typo3conf/ext/",
                    "[ -L .Build/Web/typo3conf/ext/solr ] || ln -snvf ../../../../. .Build/Web/typo3conf/ext/solr"
                ],
                "ext:version": [
                    "@php -r '$EM_CONF=[]; $_EXTKEY=\"ext\"; require_once(\"ext_emconf.php\"); echo($EM_CONF[\"ext\"][\"version\"] . PHP_EOL);'"
                ],
                "ext:env": [
                    "@putenv EXT_TMP_BUILD_PATH=/tmp/solr",
                    "@putenv EXT_ARCHIVE_DIR=.Build/archive"
                ],
                "ext:archive:path": [
                    "@ext:env",
                    "echo ${EXT_ARCHIVE_DIR}/solr_$($COMPOSER_BINARY ext:version).zip"
                ],
                "ext:build:for-ter": [
                    "@ext:env",
                    "rm -Rf ${EXT_TMP_BUILD_PATH}",
                    "git archive --format=tar --prefix=solr/ HEAD | (cd \"/tmp\" && tar xf -)",
                    "@composer req --working-dir=\"${EXT_TMP_BUILD_PATH}/Resources/Private/Php/ComposerLibraries\" solarium/solarium:`\"Build/Helpers/GET_LOCAL_PACKAGE_VERSION_CONSTRAINT.sh\" \"solarium/solarium\"`",
                    "@composer archive --working-dir=\"${EXT_TMP_BUILD_PATH}\" --format=zip --dir=\"$(pwd -P)/${EXT_ARCHIVE_DIR}\" --file=\"solr_$($COMPOSER_BINARY ext:version)\""
                ],
                "t3:docs:build": [
                    "rm -Rf Documentation-GENERATED-temp/",
                    "./Build/generate_documentation.sh"
                ],
                "t3:docs:build:prod": [
                    "BUILD_DOCS_FOR_PRODUCTION=1 $COMPOSER_BINARY t3:docs:build"
                ],
                "t3:docs:clean": [
                    "rm -Rf Documentation-GENERATED-temp/ $(readlink -f Documentation.HTML) Documentation.HTML"
                ],
                "extension-create-libs": [
                    "@composer install -d Resources/Private/Php/ComposerLibraries"
                ],
                "extension-build": [
                    "@extension-create-libs"
                ],
                "tests:restore-git": [
                    "echo \"Retore composer.json to initial state:\" && git checkout composer.json"
                ],
                "tests:env": [
                    "if [ -z ${TYPO3_VERSION+x} ]; then >&2 echo \"Can not proceed, because env var TYPO3_VERSION is not set\"; exit 1; else echo \"Setup test environment for TYPO3 ${TYPO3_VERSION}\"; fi",
                    "if echo $TYPO3_VERSION | grep -q \"dev\"; then $COMPOSER_BINARY config minimum-stability dev; fi"
                ],
                "tests:setup:global-require": [
                    "echo \"Install global composer dependencies.\"",
                    "@composer global require sclable/xml-lint"
                ],
                "tests:setup": [
                    "@tests:env",
                    "@composer req --update-with-all-dependencies typo3/cms-core:${TYPO3_VERSION}",
                    "@composer reinstall --prefer-source typo3/cms-core",
                    "@composer dump-autoload",
                    "@tests:restore-git"
                ],
                "tests:unit": [
                    "phpunit --colors --config=Build/Test/UnitTests.xml --bootstrap=.Build/vendor/nimut/testing-framework/res/Configuration/UnitTestsBootstrap.php"
                ],
                "tests:integration:be": [
                    "phpunit --colors --config=Build/Test/IntegrationTests.xml --bootstrap=.Build/vendor/nimut/testing-framework/res/Configuration/FunctionalTestsBootstrap.php"
                ],
                "tests:integration:fe": [
