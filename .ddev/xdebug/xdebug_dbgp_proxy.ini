; configuration for the Xdebug DBGp fan-out used by solr-ddev-site
; priority=90
;
; OPT-IN. Installed into /etc/php/*/mods-available/ and toggled with phpenmod/phpdismod
; via `ddev dbgp-proxy on` / `ddev dbgp-proxy off`.
;
; While disabled, Xdebug behaves exactly as DDEV ships it: `ddev xdebug on` connects
; straight to the IDE on host.docker.internal:9003, no proxy involved. Nobody has to know
; this file exists.
;
; The priority above places it after 20-xdebug.ini and 30-xdebug_code_coverage.ini, so the
; values below win. See Documentation/Xdebug-DBGp.md.

; Never connect unless the process explicitly asks for it. This is what keeps a forgotten
; breakpoint from stalling a parallel test run or somebody else's request.
xdebug.start_with_request = trigger

; Single entry point: the DBGp proxy running in this container, which hands each session to
; whichever client registered the idekey the request carries. Pick it per request with
; XDEBUG_SESSION=<idekey> — a cookie for web requests, an env var for CLI.
xdebug.discover_client_host = 0
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003

; Unless a request says otherwise, the developer's IDE gets the session.
xdebug.idekey = PHPSTORM
